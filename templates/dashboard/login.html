{% extends "layout/base.html" %}
{% block title %}Staff Login — Laazeere Academy Exam Portal{% endblock %}
{% block content %}
<section class="max-w-sm mx-auto px-4 sm:px-6 py-16">
    <div class="text-center mb-8">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-secondary text-primary">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"/></svg>
        </span>
        <h1 class="mt-4 text-2xl font-extrabold">Staff Login</h1>
        <p class="mt-2 text-sm text-muted-foreground">Use the same staff ID as the main Laazeere portal.</p>
    </div>
    <form method="post" class="card p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label for="username" class="text-sm font-semibold">Staff ID</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div>
            <label for="password" class="text-sm font-semibold">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary w-full py-3">Log in</button>
    </form>
</section>
{% endblock %}
