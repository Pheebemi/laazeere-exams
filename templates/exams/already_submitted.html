{% extends "layout/base.html" %}
{% block title %}Submitted — Laazeere Academy Exam Portal{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 py-16 text-center">
    <span class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-secondary text-primary">
        <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
    </span>
    <h1 class="mt-4 text-2xl font-extrabold">Exam submitted</h1>
    <p class="mt-1 text-sm text-muted-foreground">{{ exam.subject }} &middot; {{ exam.get_score_target_display }}</p>

    <div class="card mt-6 p-6">
        <p class="text-sm text-muted-foreground">Your score</p>
        <p class="text-4xl font-extrabold text-primary mt-1">{{ submission.score }}<span class="text-xl text-muted-foreground font-semibold"> / {{ exam.total_marks }}</span></p>
    </div>

    <a href="{% url 'exams:exam_list' %}" class="btn-outline mt-6">Back to exams</a>
</section>
{% endblock %}
