{% extends "base.html" %}
{% block content %}
<h1>Student Login</h1>
<form method="post">
  {% csrf_token %}
  <label>Student ID <input type="text" name="username" required></label><br>
  <label>Password <input type="password" name="password" required></label><br>
  <button type="submit">Log in</button>
</form>
{% endblock %}
