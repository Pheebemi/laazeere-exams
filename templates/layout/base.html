{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Laazeere Academy Exam Portal{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'assets/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="antialiased min-h-screen flex flex-col font-sans">
    {% include "includes/navbar.html" %}
    {% include "includes/messages.html" %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t bg-card">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-muted-foreground">
            &copy; Laazeere Academy &middot; Exam Portal
        </div>
    </footer>
</body>
</html>
